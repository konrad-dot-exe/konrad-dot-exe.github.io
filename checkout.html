  <!DOCTYPE html>
  <html>
    <head>
      <title>Checkout</title>
      <link rel="stylesheet" href="styles/global.css">
      <link rel="stylesheet" href="styles/checkout.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>

      <!-- NAVBAR -->
      <header class="navbar" id="navbar">
        <a href="index.html" class="logo">🥕 VeggieTable</a>
        <nav>
          <a href="index.html">Plans</a>
          <a href="menu.html">Menu</a>
          <a href="contact.html">Contact</a>
          <!-- Account Icon -->
          <a href="login.html" class="account-icon" title="Sign In">
            <i class="fa-solid fa-user"></i>
          </a>
          <!-- Cart Icon -->
          <a href="checkout.html" class="cart-icon" title="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
          </a>
        </nav>
      </header>

      <main>

        <h1 id="heading1">Checkout</h1>

        <!-- ITEM 1 -->
        <p id="p1">Super Eggplant Bowl</p>
        <p id="p2">Price: $17</p>
        <input type="button" value=" - " id="item1remove">
        <p id="item1total">0</p>
        <input type="button" value=" + " id="item1add">

        <!-- ITEM 2 -->
        <p id="p3">Tofurky Stir Fry</p>
        <p id="p4">Price: $15</p>
        <input type="button" value=" - " id="item2remove">
        <p id="item2total">0</p>
        <input type="button" value=" + " id="item2add">

        <!-- ITEM 3 -->
        <p id="p5">Pan Asian Noodle Bowl</p>
        <p id="p6">Price: $20</p>
        <input type="button" value=" - " id="item3remove">
        <p id="item3total">0</p>
        <input type="button" value=" + " id="item3add">

        <!-- TOTAL -->
        <p id="p7">Cart Total:</p>
        <p id="total">0</p>

        <!-- PAYMENT -->
        <label for="paymentmethod">Select Payment Method:</label>
        <select id="paymentmethod" name="paymentmethod">
          <option value="select">Select</option>
          <option value="debit">Debit</option>
          <option value="credit">Credit</option>
          <option value="paypal">Paypal</option>
        </select>
        <p id="messagepaymentmethod"></p>

        <p id="p8">Enter Payment Amount:</p>
        <input type="number" value="0" id="payInput">
        <input type="button" value="Confirm Purchase" id="confirm">
        <p id="messageconfirm"></p>

      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <p>&copy; 2026 VeggieTable. All rights reserved.</p>
      </footer>

      <script>

        var item1add = document.querySelector("#item1add");
        var item2add = document.querySelector("#item2add");
        var item3add = document.querySelector("#item3add");
        var item1remove = document.querySelector("#item1remove");
        var item2remove = document.querySelector("#item2remove");
        var item3remove = document.querySelector("#item3remove");

        item1add.addEventListener("click", doThisWhenClicked);
        item2add.addEventListener("click", doThisWhenClicked);
        item3add.addEventListener("click", doThisWhenClicked);
        item1remove.addEventListener("click", doThisWhenClicked);
        item2remove.addEventListener("click", doThisWhenClicked);
        item3remove.addEventListener("click", doThisWhenClicked);

        var totalPrice = 0;
        var item1total = 0;
        var item2total = 0;
        var item3total = 0;

        function doThisWhenClicked() {
          if (this.id == "item1add") {
            totalPrice += 17;
            item1total += 1;
          } else if (this.id == "item1remove" && item1total > 0) {
            totalPrice -= 17;
            item1total -= 1;
          } else if (this.id == "item2add") {
            totalPrice += 15;
            item2total += 1;
          } else if (this.id == "item2remove" && item2total > 0) {
            totalPrice -= 15;
            item2total -= 1;
          } else if (this.id == "item3add") {
            totalPrice += 20;
            item3total += 1;
          } else if (this.id == "item3remove" && item3total > 0) {
            totalPrice -= 20;
            item3total -= 1;
          }
          document.querySelector("#item1total").textContent = item1total;
          document.querySelector("#item2total").textContent = item2total;
          document.querySelector("#item3total").textContent = item3total;
          document.querySelector("#total").textContent = "$" + totalPrice;
        }

        var paymentDropdown = document.querySelector("#paymentmethod");
        var paymentMessage = document.querySelector("#messagepaymentmethod");

        paymentDropdown.addEventListener("change", function () {
          if (this.value !== "select") {
            paymentMessage.textContent = "Payment method " + this.value + " selected.";
            paymentMessage.style.color = "green";
          } else {
            paymentMessage.textContent = "";
          }
        });

        var confirm = document.querySelector("#confirm");

        confirm.addEventListener("click", function () {
          var paymentValue = document.querySelector("#payInput").value;
          var message = document.querySelector("#messageconfirm");
          var selectedMethod = document.querySelector("#paymentmethod").value;

          if (selectedMethod === "select") {
            message.textContent = "Error: Please select a payment method.";
            message.style.color = "red";
          } else if (Number(paymentValue) === totalPrice && totalPrice > 0) {
            message.textContent = "Purchase complete via " + selectedMethod + "!";
            message.style.color = "green";
            this.disabled = true;
            this.value = "Purchased";
            document.querySelector("#payInput").disabled = true;
            document.querySelector("#paymentmethod").disabled = true;
          } else {
            message.textContent = "Payment amount does not match total price.";
            message.style.color = "red";
          }
        });

      </script>

    </body>
  </html>
